<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kettle &amp; Crema – Order Ahead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF0;--surface:#FFFFFF;--ink:#16222B;--muted:#5B6B76;--line:#C9D3D8;--accent:#2B47F0;--accent-ink:#FFFFFF;--ok:#1E7A4F;--warn:#B45A12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181D;--surface:#18232A;--ink:#E8EEF1;--muted:#93A4AF;--line:#2B3A44;--accent:#7B8DFF;--accent-ink:#0E1330;--ok:#5FD39B;--warn:#F0A25E}}
:root[data-theme="dark"]{--bg:#10181D;--surface:#18232A;--ink:#E8EEF1;--muted:#93A4AF;--line:#2B3A44;--accent:#7B8DFF;--accent-ink:#0E1330;--ok:#5FD39B;--warn:#F0A25E}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{font:800 22px "Bricolage Grotesque",sans-serif}
.brand span{color:var(--accent)}
.hours{color:var(--muted);font-size:14px}
.hero{margin-bottom:28px}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.02;font-weight:800;max-width:14ch}
.hero p{color:var(--muted);max-width:52ch;margin:12px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.panel h2{font-size:22px;margin-bottom:16px}
label{display:block;font-weight:500;font-size:14px;margin:0 0 6px}
.field{margin-bottom:16px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{resize:vertical;min-height:76px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sizes input{position:absolute;opacity:0;width:1px;height:1px}
.sizes label{margin:0;border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;background:var(--bg);font-weight:500}
.sizes label small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.sizes input:checked+label{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sizes input:checked+label small{color:inherit;opacity:.85}
.sizes input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.estimate{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:4px 0 16px}
.estimate b{font:700 24px "Bricolage Grotesque",sans-serif}
.estimate span{color:var(--muted);font-size:14px}
button{font:700 16px "DM Sans",sans-serif;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);width:auto;padding:7px 12px;font-size:13px;font-weight:500}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:0 0 8px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center}
.ticket{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:var(--bg)}
.ticket .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ticket h3{font-size:18px}
.ticket .meta{color:var(--muted);font-size:14px;margin-top:2px}
.ticket .note{font-size:14px;margin-top:8px;font-style:italic}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s-queued{color:var(--warn)}.s-brewing{color:var(--accent)}.s-ready{color:var(--ok)}
.time{display:flex;align-items:baseline;gap:8px;margin:12px 0 8px}
.time b{font:800 34px "Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums}
.time span{color:var(--muted);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .9s linear}
.s-ready .bar i,.done .bar i{background:var(--ok)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Kettle &amp; <span>Crema</span></div>
    <div class="hours">Order ahead · one barista, made in order</div>
  </header>
 
  <section class="hero">
    <h1>Order now. Know when it’s ready.</h1>
    <p>Tell us what you’d like and we’ll give you a pickup time based on the drink, the size and the orders ahead of yours.</p>
  </section>
 
  <div class="grid">
    <section class="panel" aria-labelledby="f">
      <h2 id="f">Place your order</h2>
      <div class="field"><label for="name">Your name</label><input id="name" autocomplete="given-name" maxlength="40" placeholder="e.g. Maria"></div>
      <div class="field"><label for="drink">Coffee order</label><select id="drink"></select></div>
      <div class="field">
        <label id="szl">Size</label>
        <div class="sizes" role="radiogroup" aria-labelledby="szl">
          <input type="radio" name="size" id="sS" value="Small"><label for="sS">Small<small>+0 min</small></label>
          <input type="radio" name="size" id="sM" value="Medium" checked><label for="sM">Medium<small>+1 min</small></label>
          <input type="radio" name="size" id="sL" value="Large"><label for="sL">Large<small>+2 min</small></label>
        </div>
      </div>
      <div class="field"><label for="notes">Notes</label><textarea id="notes" maxlength="200" placeholder="Oat milk, extra hot, no sugar…"></textarea></div>
      <div class="estimate"><div><span>Estimated wait if ordered now</span><br><b id="est">–</b></div><span id="estsub"></span></div>
      <p class="err" id="err" role="alert"></p>
      <button id="go" type="button">Place order</button>
    </section>
 
    <section class="panel" aria-labelledby="o">
      <h2 id="o">Your orders</h2>
      <div id="list" aria-live="polite"></div>
    </section>
  </div>
</div>
 
<script>
const MENU=[["Espresso",2],["Americano",3],["Cappuccino",4],["Latte",4],["Flat White",4],["Mocha",5],["Caramel Macchiato",5],["Iced Latte",3],["Cold Brew",2]];
const SIZE_ADD={Small:0,Medium:1,Large:2};
const KEY="kc_orders_v1";
let orders=[];
const $=id=>document.getElementById(id);
 
try{const r=localStorage.getItem(KEY);if(r)orders=JSON.parse(r)||[]}catch(e){orders=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(orders))}catch(e){}}
 
$("drink").innerHTML=MENU.map(([n,m])=>`<option value="${n}">${n} (${m} min)</option>`).join("");
 
const size=()=>document.querySelector('input[name="size"]:checked').value;
const prep=(d,s)=>(MENU.find(m=>m[0]===d)||[0,3])[1]+SIZE_ADD[s];
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const clock=t=>new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lastReady=()=>orders.filter(o=>!o.done).reduce((m,o)=>Math.max(m,o.readyAt),Date.now());
 
function updateEstimate(){
  const p=prep($("drink").value,size()),wait=lastReady()-Date.now(),total=wait+p*60000;
  $("est").textContent=Math.max(1,Math.round(total/60000))+" min";
  $("estsub").textContent=p+" min to make"+(wait>1000?" + "+Math.ceil(wait/60000)+" min queue":"");
}
["drink","sS","sM","sL"].forEach(i=>$(i).addEventListener("change",updateEstimate));
 
$("go").addEventListener("click",()=>{
  const name=$("name").value.trim();
  if(!name){$("err").textContent="Enter your name so we can call it out.";$("name").focus();return}
  $("err").textContent="";
  const drink=$("drink").value,sz=size(),p=prep(drink,sz)*60000,start=lastReady();
  orders.unshift({id:Date.now(),name,drink,size:sz,notes:$("notes").value.trim(),placedAt:Date.now(),startAt:start,readyAt:start+p,done:false});
  save();$("notes").value="";render();updateEstimate();
});
 
function render(){
  const now=Date.now();
  if(!orders.length){$("list").innerHTML='<div class="empty">No orders yet. Fill in the form and place your first order.</div>';return}
  $("list").innerHTML=orders.map(o=>{
    const st=o.done?"done":now>=o.readyAt?"ready":now>=o.startAt?"brewing":"queued";
    const label={queued:"In the queue",brewing:"Being made",ready:"Ready for pickup",done:"Picked up"}[st];
    const dur=o.readyAt-o.startAt,pct=st==="queued"?0:st==="brewing"?Math.min(100,(now-o.startAt)/dur*100):100;
    const big=st==="ready"||st==="done"?"Ready":fmt(o.readyAt-now);
    const sub=st==="queued"?"until ready · starts at "+clock(o.startAt):st==="brewing"?"until ready · ready at "+clock(o.readyAt):st==="ready"?"Please come to the counter":"Enjoy!";
    return `<article class="ticket s-${st}${o.done?" done":""}" data-id="${o.id}">
      <div class="top"><div><h3>${esc(o.name)} – ${esc(o.drink)}</h3><div class="meta">${o.size} · ${Math.round(dur/60000)} min to make</div></div><span class="badge">${label}</span></div>
      ${o.notes?`<div class="note">“${esc(o.notes)}”</div>`:""}
      <div class="time"><b>${big}</b><span>${sub}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="foot"><span>Ordered at ${clock(o.placedAt)}</span>${o.done?'<button class="ghost" data-act="rm">Remove</button>':st==="ready"?'<button class="ghost" data-act="pick">Mark as picked up</button>':'<button class="ghost" data-act="cancel">Cancel order</button>'}</div>
    </article>`}).join("");
}
 
$("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b)return;
  const id=+b.closest(".ticket").dataset.id,act=b.dataset.act;
  if(act==="pick"){const o=orders.find(x=>x.id===id);if(o)o.done=true}
  else{
    const gone=orders.find(x=>x.id===id);
    orders=orders.filter(x=>x.id!==id);
    if(act==="cancel"&&gone){ // pull later orders forward
      const len=gone.readyAt-gone.startAt;
      orders.forEach(o=>{if(!o.done&&o.startAt>=gone.readyAt){o.startAt-=len;o.readyAt-=len}});
    }
  }
  save();render();updateEstimate();
});
 
render();updateEstimate();
setInterval(()=>{render();updateEstimate()},1000);
</script>
</body>
</html>
